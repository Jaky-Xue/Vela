name: Build unsigned IPA

# Builds Vela on a GitHub-hosted macOS runner and uploads an unsigned .ipa.
#
# This exists so the project can be built without owning a Mac. The runner has
# Xcode; the resulting IPA carries no signature, which is what a sideloading tool
# on Windows expects — Sideloadly and AltStore sign the app themselves with your
# Apple ID when they install it.
#
# See BUILD_WITHOUT_MAC.md for the full walkthrough.
#
# Two jobs, deliberately independent. `test` is the only automated check on the
# code's behaviour rather than its syntax, and it needs an iOS Simulator, which
# is the part of a runner image most likely to move; it therefore does not gate
# the IPA, and a simulator problem cannot cost you a build. Read the two results
# separately.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
      runner:
        description: "Runner image. macos-26 ships Xcode 26 and the iOS 26 SDK; macos-15 ships Xcode 16 and the iOS 18 SDK."
        required: true
        default: macos-26
        type: choice
        options:
          - macos-26
          - macos-15

jobs:
  build:
    name: Build Vela
    # Xcode 16 is the floor: the project uses the file-system-synchronized group
    # format (objectVersion 77) that Xcode 16 introduced.
    #
    # The image is chosen for the *SDK* it carries, because that is what decides
    # how the app behaves on a current device. An app built against an older SDK
    # runs on newer iOS, but it asks the system for compatibility behaviour: it
    # does not adopt the appearance and defaults of the release it is running on.
    # macos-26 carries Xcode 26 and the iOS 26 SDK, which is the newest the
    # runners publish — so it is the closest the build can get to a device
    # running the current release.
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build the app (unsigned)
        working-directory: .
        run: |
          xcodebuild \
            -project Vela.xcodeproj \
            -scheme Vela \
            -configuration ${{ inputs.configuration || 'Release' }} \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package as an unsigned IPA
        working-directory: .
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/${{ inputs.configuration || 'Release' }}-iphoneos/Vela.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle not found at $APP_PATH"
            find build/Build/Products -maxdepth 3 -name '*.app' || true
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # Zip the Payload directory. The .ipa format is exactly this.
          zip -qry Vela-unsigned.ipa Payload
          rm -rf Payload

          ls -lh Vela-unsigned.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vela-unsigned-ipa
          path: Vela-unsigned.ipa
          retention-days: 30

      - name: Upload the dSYM bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vela-dSYM
          path: build/Build/Products/${{ inputs.configuration || 'Release' }}-iphoneos/*.dSYM
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/Logs
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Run the unit tests
    # The same image as the build, for the same SDK reason — and because a test
    # that passes against one SDK says nothing about the other.
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Run the tests
        working-directory: .
        run: |
          set -euo pipefail

          # The simulator is chosen from what the image actually has rather than
          # named here. The device list changes with every Xcode release, so a
          # hard-coded `name=iPhone 16` is a workflow that breaks the day the
          # runner image moves on — and breaks as a build failure, which reads
          # like a code problem.
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["name"])
                      raise SystemExit
          raise SystemExit("no available iPhone simulator")
          ')
          echo "Testing on: $DEVICE"

          xcodebuild test \
            -project Vela.xcodeproj \
            -scheme Vela \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -retry-tests-on-failure \
            -resultBundlePath TestResults.xcresult
        # `-retry-tests-on-failure` re-runs just the tests that failed, once,
        # and records both attempts in the result bundle. The simulator's
        # content-process churn intermittently drops a title round-trip the
        # navigation tests wait on — a drop the navigation trace itself
        # exculpates the product of every time — and a single lost message is
        # not what this suite is here to catch. A real regression fails the
        # retry too, so the signal stays honest.

      - name: Summarise the failures
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary \
            --path TestResults.xcresult || true

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14
